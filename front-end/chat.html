<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LLM Streaming Markdown Chat (RAG)</title>
  <style>
    :root {
      --bg-main: #ffffff;
      --bg-msg-user: #fafafa;
      --bg-msg-bot: #ffffff;
      --border-color: #e0e0e0;
      --accent-blue: #1a73e8;
      --error-red: #fff5f5;
      --font-family: "Inter", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--font-family);
      margin: 0;
      padding: 20px;
      line-height: 1.5;
      color: #111;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    h2 { font-weight: 500; margin-bottom: 20px; }

    /* --- Chat Area --- */
    #chat {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 20px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 16px;
      max-width: 85%;
      font-size: 15px;
      animation: fadeIn 0.3s ease;
    }

    .user {
      background: var(--bg-msg-user);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .bot {
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    /* --- Input Area --- */
    #input-container {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }

    #prompt {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 15px;
      resize: none;
      max-height: 150px;
      outline: none;
      transition: border-color 0.2s;
    }

    #prompt:focus { border-color: var(--accent-blue); }

    .btn-icon {
      padding: 12px;
      border: 1px solid var(--border-color);
      background: white;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s;
    }

    .btn-icon:hover { background: #f5f5f5; }
    
    #stop-btn { background: var(--error-red); color: #d93025; }
    #stop-btn.hidden { display: none; }

    /* --- Thinking Animation --- */
    .thinking { display: flex; gap: 4px; padding: 8px 0; }
    .thinking span {
      width: 8px; height: 8px;
      background: #ccc;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .thinking span:nth-child(1) { animation-delay: -0.32s; }
    .thinking span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1.0); }
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <h2>SLM RAG Debugger</h2>

  <div id="chat"></div>

  <div id="input-container">
    <button id="upload-btn" class="btn-icon" title="Upload Files">📎</button>
    <textarea id="prompt" placeholder="Ask anything..." rows="1"></textarea>
    <button id="stop-btn" class="btn-icon hidden" title="Stop Generation">⛔</button>
    <input type="file" id="file-input" style="display: none;" multiple />
  </div>

  <script type="module">
    import * as smd from "https://cdn.jsdelivr.net/npm/streaming-markdown/smd.min.js";

    // 1. Configuration Constants
    const CONFIG = {
      CHAT_WS: 'ws://localhost:3000',
      TTS_WS: 'ws://localhost:3001',
      INGEST_URL: 'http://localhost:3000/api/documents/ingest',
      SAMPLE_RATE: 24000
    };

    // 2. Audio Engine (Dedicated for PCM 16bit)
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.gain = null;
        this.nextTime = 0;
        this.generation = 0;
        this.sources = new Set();
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: CONFIG.SAMPLE_RATE });
          this.gain = this.ctx.createGain();
          this.gain.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }

      stop() {
        this.generation++;
        this.sources.forEach(s => { try { s.stop(); } catch(e){} });
        this.sources.clear();
        this.nextTime = 0;
      }

      playChunk(buffer, incomingGen) {
        if (incomingGen !== this.generation) return;
        this.init();

        const samples = new Int16Array(buffer);
        const f32 = new Float32Array(samples.length);
        for (let i = 0; i < samples.length; i++) f32[i] = samples[i] / 32768.0;

        const audioBuf = this.ctx.createBuffer(1, f32.length, CONFIG.SAMPLE_RATE);
        audioBuf.getChannelData(0).set(f32);

        const source = this.ctx.createBufferSource();
        source.buffer = audioBuf;
        source.connect(this.gain);
        
        this.sources.add(source);
        source.onended = () => this.sources.delete(source);

        this.nextTime = Math.max(this.nextTime, this.ctx.currentTime);
        source.start(this.nextTime);
        this.nextTime += audioBuf.duration;
      }
    }

    // 3. UI Controller (Handles DOM & Rendering)
    class UIController {
      constructor() {
        this.chat = document.getElementById('chat');
        this.prompt = document.getElementById('prompt');
        this.stopBtn = document.getElementById('stop-btn');
      }

      appendMessage(role, text = '') {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = text;
        this.chat.appendChild(div);
        this.scrollToBottom();
        return div;
      }

      showThinking(container) {
        const div = document.createElement('div');
        div.className = 'thinking';
        div.innerHTML = '<span></span><span></span><span></span>';
        container.appendChild(div);
        return div;
      }

      toggleStopBtn(show) {
        this.stopBtn.classList.toggle('hidden', !show);
      }

      scrollToBottom() {
        this.chat.scrollTo({ top: this.chat.scrollHeight, behavior: 'smooth' });
      }

      autoResizeInput() {
        this.prompt.style.height = 'auto';
        this.prompt.style.height = Math.min(this.prompt.scrollHeight, 150) + 'px';
      }
    }

    // 4. Main Chat Service
    class ChatService {
      constructor(ui, audio, smdLibrary) {
        this.ui = ui;
        this.audio = audio;
        this.smd = smdLibrary;
        this.convId = crypto.randomUUID();
        this.isBusy = false;
        
        this.activeParser = null;
        this.activeMsgEl = null;
        this.activeThinking = null;

        this.initConnections();
      }

      initConnections() {
        this.socket = new WebSocket(CONFIG.CHAT_WS);
        this.ttsSocket = new WebSocket(`${CONFIG.TTS_WS}?conversationId=${this.convId}`);
        this.ttsSocket.binaryType = 'arraybuffer';

        this.socket.onmessage = (e) => this.handleChatData(e.data);
        this.ttsSocket.onmessage = (e) => this.audio.playChunk(e.data, this.audio.generation);
      }

      async sendPrompt() {
        const text = this.ui.prompt.value.trim();
        if (!text || this.isBusy) return;

        this.audio.stop();
        this.isBusy = true;
        this.ui.prompt.value = '';
        this.ui.autoResizeInput();
        this.ui.toggleStopBtn(true);

        // UI Setup
        this.ui.appendMessage('user', text);
        this.activeMsgEl = this.ui.appendMessage('bot');
        this.activeThinking = this.ui.showThinking(this.activeMsgEl);

        // SMD Setup
        const renderer = this.smd.default_renderer(this.activeMsgEl);
        this.activeParser = this.smd.parser(renderer);

        this.socket.send(JSON.stringify({
          action: 'api:prompt',
          payload: { prompt: text, conversationId: this.convId }
        }));
      }

      handleChatData(rawData) {
        try {
          const cleanData = rawData.replace(/^data: /, '').trim();
          if (cleanData === '[DONE]') return this.finishTurn();
          
          const obj = JSON.parse(cleanData);
          if (this.activeThinking) { this.activeThinking.remove(); this.activeThinking = null; }

          if (obj.type === 'text') {
            this.smd.parser_write(this.activeParser, obj.delta);
          } else if (obj.type === 'done' || obj.type === 'error') {
            this.finishTurn(obj.type === 'error' ? `\n\n❌ ${obj.delta}` : '');
          }
          this.ui.scrollToBottom();
        } catch (e) { console.error("Parse Error", e); }
      }

      stop() {
        this.audio.stop();
        if (this.socket.readyState === 1) this.socket.send(JSON.stringify({ action: 'api:stop' }));
        if (this.ttsSocket.readyState === 1) this.ttsSocket.send(JSON.stringify({ action: 'stop' }));
        this.finishTurn('[Stopped]');
      }

      finishTurn(suffix = '') {
        if (this.activeParser) this.smd.parser_end(this.activeParser);
        if (suffix) this.activeMsgEl.innerHTML += suffix;
        
        this.isBusy = false;
        this.activeParser = null;
        this.ui.toggleStopBtn(false);
      }
    }

    // 5. App Bootstrap
    const ui = new UIController();
    const audio = new AudioEngine();
    const chat = new ChatService(ui, audio, smd);

    // Event Listeners
    ui.prompt.addEventListener('input', () => ui.autoResizeInput());
    ui.prompt.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chat.sendPrompt(); }
    });

    document.getElementById('stop-btn').addEventListener('click', () => chat.stop());

    // File Upload logic (Simplified for readability)
    const fileInput = document.getElementById('file-input');
    document.getElementById('upload-btn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
      const files = fileInput.files;
      if (!files.length) return;
      
      ui.appendMessage('user', `📎 Uploading: ${files[0].name}...`);
      const formData = new FormData();
      [...files].forEach(f => formData.append('files', f));

      try {
        const res = await fetch(CONFIG.INGEST_URL, { method: 'POST', body: formData });
        ui.appendMessage('bot', res.ok ? "✅ Processing complete." : "❌ Upload failed.");
      } catch (e) { ui.appendMessage('bot', "❌ Error connecting to server."); }
    });

  </script>
</body>
</html>
